name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: pyinstaller --clean --noconfirm WordTextReplacer.spec

      - name: Smoke-check executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/WordTextReplacer.exe")) {
            throw "dist/WordTextReplacer.exe was not created"
          }
          Get-Item "dist/WordTextReplacer.exe" | Format-List Name,Length,LastWriteTime

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: WordTextReplacer-Windows-x64
          path: dist/WordTextReplacer.exe
          if-no-files-found: error
          retention-days: 30
